# Local self-host stack: the Souskai web platform + a matching PostgreSQL 17
# (Neon-compatible) you can point DATABASE_URL at if you want a bundled DB.
#
#   cp .env.example .env   # fill in real values
#   docker compose up --build
#
# The app runs against whatever DATABASE_URL is in `.env` (Neon, or the bundled
# `db` service via `postgres://postgres:postgres@db:5432/souskai`). Because
# `next build` prerenders static params against a *live* database, DATABASE_URL
# + PAYLOAD_SECRET are handed to the image build as BuildKit *secrets* (see the
# `secrets:` block and the Dockerfile header) — never baked into the image or
# logged. Secrets stay local: `.dockerignore` keeps `.env`, node_modules,
# `.next`, and agent/docs state out of the build context.

services:
  web:
    build:
      context: .
      secrets:
        - source: DATABASE_URL
          target: DATABASE_URL
        - source: PAYLOAD_SECRET
          target: PAYLOAD_SECRET
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: souskai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d souskai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

secrets:
  DATABASE_URL:
    environment: DATABASE_URL
  PAYLOAD_SECRET:
    environment: PAYLOAD_SECRET
